<ion-content [fullscreen]="true" [scrollY]="false" class="no-scroll-content">
  <div id="container">
    <ion-grid fixed class="ion-margin">
      <ion-row class="ion-align-items-center">
        <ion-col sizeXs="1" sizeSm="3" size="1"></ion-col>
        <ion-col
          sizeXs="10"
          sizeSm="6"
          size="10"
          class="ion-align-items-center"
        >
          <ion-card class="ion-margin-vertical ion-padding" mode="ios">
            <ion-row>
              <ion-col size="9">
                <h3>Ouvrir une session</h3>
                <form (ngSubmit)="login($event)" [formGroup]="credentials">
                  <ion-item>
                    <!-- <ion-label position="floating">Mon pseudo</ion-label> -->
                    <ion-input
                      mode="ios"
                      placeholder="Mail"
                      type="text"
                      formControlName="email"
                    ></ion-input>
                  </ion-item>
                  <ion-item>
                    <!-- <ion-label position="floating">Mon ncode</ion-label> -->
                    <ion-input
                      type="password"
                      placeholder="Mot de passe"
                      formControlName="password"
                    ></ion-input>
                  </ion-item>
                  <section class="btn-bottom">
                    <ion-button
                      expand="default"
                      fill="solid"
                      size="small"
                      color="orange"
                      shape="round"
                      (click)="login($event)"
                    >
                      Connexion
                    </ion-button>
                  </section>
                </form>
              </ion-col>
              <ion-col size="3">
                <img src="assets/textures/shasa/Shasa.png" />
              </ion-col>
            </ion-row>
          </ion-card>
        </ion-col>
        <ion-col sizeXs="1" sizeSm="3" size="1"> </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
