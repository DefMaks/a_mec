<!-- eslint-disable @angular-eslint/template/eqeqeq -->
<ion-header *ngIf="!maskLoader">
  <ion-toolbar mode="ios">
    <ion-buttons slot="start">
      <ion-button color="teal" (click)="togglePane()">
        <ng-container *ngIf="paneVisible; else setTogglePane">
          <ion-icon src="assets/icons/menu_alt.svg"></ion-icon>
        </ng-container>
        <ng-template #setTogglePane> <strong>Menu</strong> </ng-template>
      </ion-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button color="teal">
        <ion-icon name="person"></ion-icon>
      </ion-button>
      <ion-button
        color="teal"
        [routerLink]="['chat-log']"
        routerLinkActive="router-link-active"
        *ngIf="appGlobal.user.role === 'teacher'"
      >
        <strong><ion-icon name="mail-outline"></ion-icon></strong>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-split-pane [when]="paneVisible" contentId="main" *ngIf="!maskLoader">
  <ion-menu contentId="main">
    <ion-content id="mecm-menu" class="ion-padding">
      <ion-menu-toggle auto-hide="false">
        <ion-item
          mode="ios"
          detail
          lines="none"
          routerDirection="root"
          [routerLink]="['dash']"
          routerLinkActive="router-link-active custom-active-class"
        >
          <ion-icon src="assets/icons/dashboard.svg" slot="start"></ion-icon>
          <ion-label> Dashboard </ion-label>
        </ion-item>
      </ion-menu-toggle>
      <!-- <ng-container *ngIf="appGlobal.user"> -->
      <ng-container *ngFor="let world of theLinks">
        <!-- {{appGlobal.user?.role}}-{{world.role}} -->
        <!-- <ng-container *ngIf="appGlobal?.user?.role == world.role"> -->
        <!-- <ng-container *ngIf="appGlobal?.user?.role == world.role"> -->
        <ion-menu-toggle auto-hide="false" *ngFor="let item of world.links">
          <ion-item
            mode="ios"
            detail
            lines="none"
            routerDirection="root"
            [routerLink]="[item.url]"
            routerLinkActive="router-link-active custom-active-class"
            [routerLinkActiveOptions]="{ exact: item.url !== '' }"
          >
            <ion-icon
              *ngIf="item.iconname"
              [name]="item.iconname"
              slot="start"
            ></ion-icon>
            <ion-icon
              *ngIf="item.iconsrc"
              [src]="item.iconsrc"
              slot="start"
            ></ion-icon>
            <ion-label> {{item.title}} </ion-label>
          </ion-item>
          <!-- <div *ngIf="appGlobal.hasSub" class="ion-padding-start">
              <ion-item>
                <ion-label>Awesome Label</ion-label>
              </ion-item>
              <ion-item>
                <ion-label>Awesome Label</ion-label>
              </ion-item>
            </div> -->
        </ion-menu-toggle>

        <ion-item button (click)="signout()" mode="ios" detail lines="none">
          <ion-label> Déconnexion </ion-label>
        </ion-item>
        <!-- </ng-container> -->
        <!-- </ng-container> -->
      </ng-container>
      <!-- </ng-container> -->
    </ion-content>
    <ion-toast
      color="teal"
      [isOpen]="isSigningOut"
      message="Déconnexion en cours"
    ></ion-toast>
  </ion-menu>

  <!-- <div class="ion-page" id="main"> -->

  <ion-router-outlet id="main"> </ion-router-outlet>
  <!-- </div> -->
</ion-split-pane>
<ion-router-outlet *ngIf="maskLoader">
  <div class="mask-loader" *ngIf="maskLoader">
    <div id="container">
      <ion-spinner name="dots"></ion-spinner>
      <p>
        <br />
        Chargement de votre espace
      </p>
    </div>
  </div>
</ion-router-outlet>

<ng-container *ngIf="isSigningOutMask">
  <div
    class="darkening-effect"
    style="
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
    "
  ></div>
</ng-container>
